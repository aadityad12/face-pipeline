[project]
name = "facepipe"
version = "0.1.0"
description = "Face detection and recognition built end to end on a laptop."
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facepipe"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
